name: Deploy Web Vite

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Cài đặt thư viện
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload code đã build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy lên mạng
        id: deployment
        uses: actions/deploy-pages@v4